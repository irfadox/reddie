name: 'Reddie AI Red-Teaming & Auto-Patch Action'
description: 'Autonomous AI Red-Teaming, reproduction PyTest generation, and automated GitHub PR patching for LLM apps.'
author: 'Reddie Team'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  repo-path:
    description: 'Path to target repository directory.'
    required: false
    default: '.'
  endpoint-url:
    description: 'Target LLM endpoint URL or mock interface.'
    required: false
    default: 'mock://local'
  github-token:
    description: 'GitHub token for branch creation and opening PRs.'
    required: false
    default: ${{ github.token }}
  export-html:
    description: 'Path to export interactive HTML security audit report.'
    required: false
    default: 'reddie-report.html'
  export-json:
    description: 'Path to export JSON audit report.'
    required: false
    default: 'reddie-report.json'
  dry-run:
    description: 'Run audit and verification without creating remote PRs.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Reddie
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install git+https://github.com/reddie-ai/reddie.git || pip install -r ${{ github.action_path }}/requirements.txt

    - name: Run Reddie Security Audit & Auto-Patch
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        DRY_RUN_FLAG=""
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          DRY_RUN_FLAG="--dry-run"
        fi
        
        python3 -m main \
          --repo-path "${{ inputs.repo-path }}" \
          --endpoint-url "${{ inputs.endpoint-url }}" \
          --github-repo "${{ github.repository }}" \
          --github-token "${{ inputs.github-token }}" \
          --export-html "${{ inputs.export-html }}" \
          --export-json "${{ inputs.export-json }}" \
          $DRY_RUN_FLAG

    - name: Upload Security Audit Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: reddie-security-report
        path: |
          ${{ inputs.export-html }}
          ${{ inputs.export-json }}
