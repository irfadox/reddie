[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reddie-ai"
version = "0.1.0"
description = "Autonomous AI Red-Teaming & GitHub PR Patching DevTool"
readme = "README.md"
authors = [{ name = "Reddie Team", email = "security@reddie.ai" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["security", "red-teaming", "llm", "langgraph", "devsecops", "patching", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "PyGithub>=2.1.1",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
reddie = "main:main"

[tool.setuptools]
py-modules = ["main", "state", "workflow"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
